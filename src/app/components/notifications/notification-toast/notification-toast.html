<div class="toast-body">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
       stroke-width="1.5" stroke="currentColor" class="toast-icon" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath()" />
  </svg>

  <div class="toast-content">
    @if (notification().title) {
      <p class="toast-title">{{ notification().title }}</p>
    }
    <p class="toast-message">{{ notification().message }}</p>
  </div>

  @if (notification().dismissible !== false) {
    <button
      type="button"
      class="toast-dismiss"
      aria-label="Dismiss notification"
      (click)="onDismiss()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.5" stroke="currentColor" class="size-4" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
